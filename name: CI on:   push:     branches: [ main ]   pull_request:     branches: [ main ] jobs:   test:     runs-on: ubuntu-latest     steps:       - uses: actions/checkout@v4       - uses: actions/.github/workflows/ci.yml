name: CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install -r requirements.txt
      - name: Run tests
        env:
          ANTHROPIC_API_KEY: dummy-key-for-ci
        run: pytest -v
      - run: python main.py --help
      - run: python main.py hello
