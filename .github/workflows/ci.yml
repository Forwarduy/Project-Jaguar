name: CI
on: [push]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - run: pip install -r requirements.txt
      - run: pytest -v
        env:
          ANTHROPIC_API_KEY: dummy
