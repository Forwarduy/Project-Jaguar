[project]
name = "project-jaguar"
version = "0.1.0"
description = "Open-source multi-agent AI platform for strategic planning & business automation"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name="Forwarduy", email="forwarduy@proton.me"}]
keywords = ["ai-agents", "langchain", "n8n", "claude-code", "mcp"]
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "langchain>=0.2.0",
    "langchain-community>=0.2.0",
    "langchain-anthropic>=0.1.0",
    "anthropic>=0.25.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "pyyaml>=6.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.urls]
Homepage = "https://github.com/Forwarduy/Project-Jaguar"

[tool.pytest.ini_options]
pythonpath = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
