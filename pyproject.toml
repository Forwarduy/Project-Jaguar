[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "project-jaguar"
version = "0.1.0"
description = "Multi-agent AI platform"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.30.0",
    "langchain>=0.2.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "rich>=13.7.0",
    "typer>=0.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.14.0",
]

[tool.hatch.build.targets.wheel]
packages = [
    "agents",
    "main.py",
    "config.py",
]
